[package]
name = "novaterm"
version = "0.1.0"
description = "NovaTerm - A cross-platform SSH terminal client"
authors = ["lighthouse"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang.org/cargo/issues/8519
name = "novaterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.50"
# russh-keys disabled due to GTK dependencies
# russh-keys = { version = "0.50.0-beta.7" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
russh-sftp = "2"
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"

